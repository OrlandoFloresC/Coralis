# Builds Coralis.app for Macs with an Apple chip and packs it in a .dmg.
#  - every push to main: build + quick test; the .dmg is kept as a download of the run
#  - a version tag (git tag v0.1.0 && git push origin v0.1.0): also published in Releases
name: Mac (.dmg)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # only in the public repository (Mac minutes are free there; the private copy would spend its quota)
    if: github.repository == 'OrlandoFloresC/Coralis'
    runs-on: macos-latest   # always an Apple chip (arm64); macos-14 was retired
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Coralis and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,app]"

      - name: Tests
        run: python -m pytest -q

      - name: Build Coralis.app
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/coralis.spec

      - name: Check the app opens its libraries
        run: dist/Coralis.app/Contents/MacOS/Coralis --check

      - name: Pack the .dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="prueba-${GITHUB_SHA::7}";; esac
          mkdir -p dmg
          cp -R dist/Coralis.app dmg/
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Coralis" -srcfolder dmg -ov -format UDZO "Coralis-${VERSION}-Mac-chip-Apple.dmg"
          echo "DMG=Coralis-${VERSION}-Mac-chip-Apple.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Coralis-Mac
          path: ${{ env.DMG }}
          retention-days: 14

      # what is new in this version (its section of NOVEDADES.md), then the Mac notes below
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="## $V" '/^## /{p = (index($0, v) == 1)} p' NOVEDADES.md > notas.md
          printf '\n' >> notas.md
          sed -n '/^ *body: |$/,$p' .github/workflows/mac.yml | sed '1d; s/^            //' >> notas.md
          cat notas.md

      - name: Publish in Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG }}
          append_body: true
          body_path: notas.md
          body: |
            **Importante:** Coralis puede equivocarse (notas, ritmos, letra, repeticiones o estrofas). El reporte
            marca los compases dudosos. Compara siempre el resultado con la partitura impresa: la decisión final
            la tienes tú.

            **Mac con chip de Apple (M1 o posterior).** Descarga el `.dmg`, ábrelo y arrastra Coralis a Aplicaciones.

            La primera vez que abras Coralis, macOS dirá que no puede comprobar el desarrollador (la app no está
            firmada). Ábrela así: **Ajustes del Sistema → Privacidad y seguridad → «Abrir igualmente»** (abajo).
            Solo hace falta una vez.

            Al abrirse por primera vez, Coralis descarga sus lectores de partituras (unos 400 MB). Después ya no.
